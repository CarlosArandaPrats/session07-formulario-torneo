<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción Torneo Gaming</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <h1>Torneo Gaming 2026</h1>
      <p>Formulario de inscripción</p>
    </header>

    <main>
      <form action="#" method="post">
        <fieldset>
          <legend>Datos personales</legend>

          <div class="form-group">
            <label for="nombre" class="is-required">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>

          <div class="form-group">
            <label for="email" class="is-required">Correo electrónico</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="16" />
          </div>

          <div class="form-group">
            <label for="fecha">Fecha de nacimiento</label>
            <input type="date" id="fecha" name="fecha" />
          </div>
        </fieldset>

        <fieldset>
          <legend>Cuenta de jugador</legend>

          <div class="form-group">
            <label for="nickname" class="is-required">Nombre del jugador (nickname)</label>
            <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" required />
          </div>

          <div class="form-group">
            <label for="password" class="is-required">Contraseña de la cuenta</label>
            <input type="password" id="password" name="password" required />
          </div>
        </fieldset>

        <fieldset>
          <legend>Torneo</legend>

          <div class="form-group">
            <label for="videojuego">Videojuego del torneo</label>
            <select id="videojuego" name="videojuego">
              <option value="valorant">Valorant</option>
              <option value="lol">League of Legends</option>
              <option value="fortnite">Fortnite</option>
              <option value="rocket-league">Rocket League</option>
              <option value="fc26">EA Sports FC 26</option>
            </select>
          </div>

          <div class="form-group">
            <label>Plataforma</label>
            <input type="radio" id="pc" name="plataforma" value="pc" />
            <label for="pc" class="inline">PC</label>
            <input type="radio" id="playstation" name="plataforma" value="playstation" />
            <label for="playstation" class="inline">PlayStation</label>
            <input type="radio" id="xbox" name="plataforma" value="xbox" />
            <label for="xbox" class="inline">Xbox</label>
          </div>

          <div class="form-group">
            <label>Disponibilidad horaria</label>
            <input type="checkbox" id="manana" name="manana" value="manana" />
            <label for="manana" class="inline">Mañana</label>
            <input type="checkbox" id="tarde" name="tarde" value="tarde" />
            <label for="tarde" class="inline">Tarde</label>
            <input type="checkbox" id="noche" name="noche" value="noche" />
            <label for="noche" class="inline">Noche</label>
          </div>

          <div class="form-group">
            <label for="comentarios">Comentarios adicionales</label>
            <textarea id="comentarios" name="comentarios" rows="4"></textarea>
          </div>
        </fieldset>

        <div class="form-group">
          <input type="checkbox" id="normas" name="normas" required />
          <label for="normas" class="inline is-required">Acepto las <a href="./normas.html">normas</a> del torneo</label>
        </div>

        <button type="submit" class="btn">Inscribirme</button>
        <button type="reset" class="btn btn-reset">Limpiar formulario</button>
      </form>
    </main>
  </body>
</html>
